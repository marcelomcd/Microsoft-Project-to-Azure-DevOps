# Pipeline de notificação Teams (8h BRT)
#
# Executa às 8h BRT; baixa o artefato sync_logs da última execução da pipeline de
# sincronização (6:30) e envia mensagem no Teams para cada PMO com a lista de Tasks
# que estão fechadas no Azure DevOps mas não estavam no .mpp.
#
# Pré-requisitos:
# 1. Criar uma nova Pipeline no Azure DevOps que use este arquivo (azure-pipelines-teams-notify.yml).
# 2. Pipeline > Variables: definir TEAMS_NOTIFICATION_ENABLED=true e as variáveis abaixo (obrigatório para envio).
#    Sem elas o step não quebra, mas nenhuma mensagem é enviada (log: "TEAMS_NOTIFICATION_ENABLED não está ativo").
#    - TEAMS_NOTIFICATION_ENABLED = true
#    - GRAPH_CLIENT_ID, GRAPH_CLIENT_SECRET, GRAPH_TENANT_ID
#    - TEAMS_REFRESH_TOKEN (secret, recomendado; obter com python scripts/get_teams_refresh_token.py)
#    - TEAMS_VERIFICATION_EMAIL, AZURE_DEVOPS_ORG
#    - Opcional: SHAREPOINT_*, AZURE_DEVOPS_FEATURE_BOARD_BASE_URL
# 3. O recurso mpp_sync referencia a pipeline de sync (6:30); nome/projeto em resources.pipelines abaixo.

trigger: none

# Pipeline de sync 6:30 BRT (Qualiit.AzureProjects.ProjectIntegration no projeto ALM)
# branch: main — usa apenas runs do main; sem isso o Azure pode mostrar "Cannot determine pipeline run version" ao rodar manualmente.
# É necessário que a pipeline de Sync tenha ao menos uma execução bem-sucedida no main.
resources:
  pipelines:
  - pipeline: mpp_sync
    source: Qualiit.AzureProjects.ProjectIntegration
    project: ALM
    branch: main

schedules:
  - cron: "0 11 * * *"   # 11:00 UTC = 8h BRT
    displayName: Notificação Teams - 8h BRT
    branches:
      include:
        - main
        - master
    always: true

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: PYTHON_VERSION
    value: '3.10'

steps:
  - checkout: self
    displayName: 'Checkout'
    fetchDepth: 1

  - task: UsePythonVersion@0
    displayName: 'Configurar Python $(PYTHON_VERSION)'
    inputs:
      versionSpec: '$(PYTHON_VERSION)'
      addToPath: true

  - script: |
      cd backend
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Instalar dependências Python'
    workingDirectory: '$(System.DefaultWorkingDirectory)'

  # Usa o recurso mpp_sync já resolvido (evita "No builds exist" da task com pipeline ID)
  - download: mpp_sync
    displayName: 'Baixar logs da última sincronização (6:30)'
    artifact: sync_logs

  # Variáveis vêm do env: abaixo (configurar na Pipeline > Variables da pipeline de notificação Teams)
  - script: |
      cd backend
      REPORT="$(Pipeline.Workspace)/mpp_sync/sync_logs/closed_tasks_report.json"
      if [ -f "$REPORT" ]; then
        python teams_notify.py --report "$REPORT"
      else
        echo "Arquivo closed_tasks_report.json não encontrado (nenhuma task fechada para notificar ou artefato indisponível)"
      fi
    displayName: 'Enviar notificações Teams para PMOs'
    env:
      TEAMS_NOTIFICATION_ENABLED: $(TEAMS_NOTIFICATION_ENABLED)
      GRAPH_CLIENT_ID: $(GRAPH_CLIENT_ID)
      GRAPH_CLIENT_SECRET: $(GRAPH_CLIENT_SECRET)
      GRAPH_TENANT_ID: $(GRAPH_TENANT_ID)
      SHAREPOINT_CLIENT_ID: $(SHAREPOINT_CLIENT_ID)
      SHAREPOINT_CLIENT_SECRET: $(SHAREPOINT_CLIENT_SECRET)
      SHAREPOINT_TENANT_ID: $(SHAREPOINT_TENANT_ID)
      AZURE_DEVOPS_ORG: $(AZURE_DEVOPS_ORG)
      TEAMS_VERIFICATION_EMAIL: $(TEAMS_VERIFICATION_EMAIL)
      TEAMS_REFRESH_TOKEN: $(TEAMS_REFRESH_TOKEN)
      AZURE_DEVOPS_FEATURE_BOARD_BASE_URL: $(AZURE_DEVOPS_FEATURE_BOARD_BASE_URL)
    condition: succeeded()
