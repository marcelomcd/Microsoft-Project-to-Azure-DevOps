(function() {

  function fmtTs(ts) {
    if (!ts) return '—';
    const iso = ts.includes('T') ? ts : ts.replace(' ', 'T');
    const d = new Date(iso);
    if (isNaN(d.getTime())) return ts;
    return d.toLocaleString('pt-BR', { hour12: false });
  }

  function badge(text, tone) {
    const span = document.createElement('span');
    span.className = 'badge' + (tone ? ' ' + tone : '');
    span.textContent = text;
    return span;
  }

  function pill(text, tone) {
    const span = document.createElement('span');
    span.className = 'pill' + (tone ? ' ' + tone : '');
    const dot = document.createElement('span');
    dot.className = 'dot' + (tone ? ' ' + tone : '');
    span.appendChild(dot);
    span.appendChild(document.createTextNode(text));
    return span;
  }

  function normalize(str) {
    return (str ?? '').toString().toLowerCase();
  }

  function buildStat(label, value, hint, tone) {
    const div = document.createElement('div');
    div.className = 'stat' + (tone ? ' ' + tone : '');
    const l = document.createElement('div');
    l.className = 'lbl';
    l.textContent = label;
    const v = document.createElement('div');
    v.className = 'val';
    v.textContent = value;
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = hint;
    div.append(l, v, h);
    return div;
  }

  function buildTable(items) {
    const wrap = document.createElement('div');
    wrap.className = 'tableWrap';
    const table = document.createElement('table');

    const thead = document.createElement('thead');
    const trh = document.createElement('tr');

      th.textContent = h;
      trh.appendChild(th);
    });
    thead.appendChild(trh);

      const tdType = document.createElement('td');
      tdType.appendChild(pill(it.work_item_type || '—', it.action === 'failed' ? 'bad' : 'info'));

      const tdTitle = document.createElement('td');
      tdTitle.textContent = it.title || '—';

      const tdId = document.createElement('td');
      tdId.className = 'mono';
      tdId.textContent = it.work_item_id ?? '—';

      const tdParent = document.createElement('td');
      tdParent.className = 'mono';
      tdParent.textContent = it.parent_id ?? '—';

      const tdMpp = document.createElement('td');
      tdMpp.className = 'mono';
      tdMpp.textContent = it.mpp_task_id ?? '—';

      const tdAction = document.createElement('td');
      const actionTone = it.action === 'failed' ? 'bad' : (it.action === 'skipped' ? 'warn' : (it.action === 'created' ? 'ok' : 'info'));
      tdAction.appendChild(pill(it.action || '—', actionTone));

      const tdErr = document.createElement('td');
      tdErr.style.color = it.error ? 'var(--bad)' : 'var(--muted)';
      tdErr.textContent = it.error ? it.error : '—';

      tr.append(tdType, tdTitle, tdId, tdParent, tdMpp, tdAction, tdErr);
      tbody.appendChild(tr);
    });

    table.append(thead, tbody);
    wrap.appendChild(table);
    return wrap;

    el.className = 'chip';
    const dot = document.createElement('span');
    dot.className = 'dot ' + (c.tone || 'info');

  $('badgeHealth').className = 'badge ' + ((failedUS + failedT) > 0 ? 'bad' : 'ok');

  const statsGrid = $('statsGrid');
  statsGrid.appendChild(buildStat('No arquivo (ref.)', refUS + refT, 'User Stories: ' + refUS + ' • Tasks: ' + refT, 'info'));
  statsGrid.appendChild(buildStat('Na Feature (antes)', existingUS + existingT, 'User Stories: ' + existingUS + ' • Tasks: ' + existingT, 'warn'));
  statsGrid.appendChild(buildStat('Criados', createdUS + createdT, 'User Stories: ' + createdUS + ' • Tasks: ' + createdT, 'ok'));
  statsGrid.appendChild(buildStat('Atualizados', updatedUS + updatedT, 'User Stories: ' + updatedUS + ' • Tasks: ' + updatedT, 'info'));
  statsGrid.appendChild(buildStat('Ignorados', skippedUS + skippedT, 'User Stories: ' + skippedUS + ' • Tasks: ' + skippedT, 'warn'));
  statsGrid.appendChild(buildStat('Erros', failedUS + failedT, 'User Stories: ' + failedUS + ' • Tasks: ' + failedT, (failedUS + failedT) ? 'bad' : 'ok'));

  // Sections + search
  const sections = [
    { key: 'created_user_stories', label: 'User Stories — Criadas', tone: 'ok' },
    { key: 'updated_user_stories', label: 'User Stories — Atualizadas', tone: 'info' },
    { key: 'skipped_user_stories', label: 'User Stories — Ignoradas', tone: 'warn' },
    { key: 'failed_user_stories', label: 'User Stories — Falhas', tone: 'bad' },
    { key: 'created_tasks', label: 'Tasks — Criadas', tone: 'ok' },
    { key: 'updated_tasks', label: 'Tasks — Atualizadas', tone: 'info' },
    { key: 'skipped_tasks', label: 'Tasks — Ignoradas', tone: 'warn' },
    { key: 'failed_tasks', label: 'Tasks — Falhas', tone: 'bad' },
  ];

  function allItems() {
    const items = [];
    sections.forEach(s => {
      const arr = data[s.key] || [];
      arr.forEach(it => items.push(Object.assign({}, it, {__section: s.key})));
    });
    return items;
  }

  const index = allItems();
  const sectionsEl = $('sections');

  function render(filterText) {
    sectionsEl.innerHTML = '';
    const q = normalize(filterText);
    let shownTotal = 0;

    sections.forEach(s => {
      const arr = (data[s.key] || []);
      const filtered = q
        ? arr.filter(it => {
            const hay = [
              it.title, it.work_item_type, it.work_item_id, it.parent_id,
              it.action, it.mpp_task_id, it.error
            ].map(x => (x ?? '').toString()).join(' • ').toLowerCase();
            return hay.includes(q);
          })
        : arr;

      shownTotal += filtered.length;

      const d = document.createElement('details');
      d.open = (s.key.includes('failed') && filtered.length) || (q && filtered.length);

      const sum = document.createElement('summary');
      sum.appendChild(document.createTextNode(s.label));

      const right = document.createElement('div');
      right.style.display = 'flex';
      right.style.gap = '10px';
      right.style.alignItems = 'center';
      right.appendChild(badge(filtered.length + ' item(s)', s.tone));
      if (s.key.includes('failed') && filtered.length) right.appendChild(badge('verificar', 'bad'));
      sum.appendChild(right);

      d.appendChild(sum);

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'tableWrap';
        const p = document.createElement('div');
        p.className = 'small';
        p.textContent = 'Sem itens nesta categoria.';
        empty.appendChild(p);
        d.appendChild(empty);
      } else {
        d.appendChild(buildTable(filtered));
      }

      sectionsEl.appendChild(d);
      const spacer = document.createElement('div');
      spacer.style.height = '10px';
      sectionsEl.appendChild(spacer);
    });

    $('countShown').textContent = q ? (shownTotal + ' item(s) visíveis') : (index.length + ' item(s) no total');
  }

  render('');
  $('search').addEventListener('input', (e) => render(e.target.value));

  // Raw JSON
  $('rawJson').textContent = JSON.stringify(data, null, 2);

  // Theme toggle
  $('toggleTheme').addEventListener('click', () => {
    const root = document.documentElement;
    const cur = root.getAttribute('data-theme') || 'dark';
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });

  // Copy / Download
  $('copyJson').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(JSON.stringify(data, null, 2));
      $('copyJson').textContent = 'Copiado ✓';
      setTimeout(() => $('copyJson').textContent = 'Copiar JSON', 1200);
    } catch (e) {
      alert('Não foi possível copiar automaticamente. Abra a seção "JSON bruto" e copie manualmente.');
    }
  });

  $('downloadJson').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const safe = (data.feature_id ?? 'log').toString().replace(/[^a-z0-9_-]/gi,'_');
    a.download = 'sync_log_' + safe + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // Footer
  $('generatedAt').textContent = new Date().toLocaleString('pt-BR', { hour12: false });
})();
</script>
</body>
</html>
