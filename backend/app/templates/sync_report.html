<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sync Report — Feature {{FEATURE_ID}}</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(255,255,255,0.06);
      --panel2: rgba(255,255,255,0.09);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.62);
      --border: rgba(255,255,255,0.12);
      --shadow: 0 20px 60px rgba(0,0,0,0.45);
      --ok: #43f5a3;
      --warn: #ffd166;
      --bad: #ff5c7a;
      --info: #78a6ff;
      --us: #7eb8ff;
      --task: #c9a227;
      --update: #43f5a3;
      --chip: rgba(255,255,255,0.10);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
    }
    [data-theme="light"] {
      --bg: #f7f8fb;
      --panel: rgba(10, 21, 49, 0.05);
      --panel2: rgba(10, 21, 49, 0.08);
      --text: rgba(10, 21, 49, 0.92);
      --muted: rgba(10, 21, 49, 0.60);
      --border: rgba(10, 21, 49, 0.12);
      --shadow: 0 20px 60px rgba(10, 21, 49, 0.12);
      --chip: rgba(10, 21, 49, 0.08);
      --us: #2d7ae0;
      --task: #a67c00;
      --update: #107c10;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(1200px 700px at 20% 0%, rgba(120,166,255,.16), transparent 55%),
                  radial-gradient(1200px 700px at 80% 0%, rgba(67,245,163,.14), transparent 55%),
                  var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.35;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 18px 64px; }
    header {
      display: flex; gap: 16px; align-items: flex-start; justify-content: space-between;
      margin-bottom: 18px;
    }
    .title { display: grid; gap: 8px; }
    .title h1 { margin: 0; font-size: 20px; font-weight: 760; letter-spacing: .2px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      appearance: none; border: 1px solid var(--border); background: var(--panel);
      color: var(--text); padding: 9px 12px; border-radius: 12px; cursor: pointer;
      font-size: 12.5px; font-weight: 700;
      box-shadow: 0 10px 24px rgba(0,0,0,.16);
    }
    .btn:hover { background: var(--panel2); }
    .btn:active { transform: translateY(1px); }
    .grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 14px; margin-top: 14px; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    .card {
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--panel), rgba(255,255,255,0.03));
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card .hd {
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
    }
    .card .hd h2 {
      margin: 0; font-size: 13px; letter-spacing: .25px; text-transform: uppercase;
      color: var(--muted);
      font-weight: 900;
    }
    .card .bd { padding: 14px 16px 16px; }
    .kv { display: grid; grid-template-columns: 160px 1fr; gap: 10px; align-items: start; font-size: 13px; }
    @media (max-width: 560px) { .kv { grid-template-columns: 1fr; } }
    .k { color: var(--muted); font-weight: 760; }
    .v { color: var(--text); overflow-wrap: anywhere; }
    .mono { font-family: var(--mono); font-size: 12.5px; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top: 12px; }
    .chip {
      border: 1px solid var(--border);
      background: var(--chip);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      display: inline-flex; align-items: center; gap: 8px;
      font-weight: 780;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--info);
      box-shadow: 0 0 0 4px rgba(120,166,255,.15);
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px rgba(67,245,163,.16); }
    .dot.bad { background: var(--bad); box-shadow: 0 0 0 4px rgba(255,92,122,.16); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 0 4px rgba(255,209,102,.16); }
    .dot.info { background: var(--info); box-shadow: 0 0 0 4px rgba(120,166,255,.16); }
    .dot.us { background: var(--us); box-shadow: 0 0 0 4px rgba(126,184,255,.2); }
    .dot.task { background: var(--task); box-shadow: 0 0 0 4px rgba(201,162,39,.2); }
    .dot.update { background: var(--update); box-shadow: 0 0 0 4px rgba(67,245,163,.16); }
    .stats { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .stat {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      border-radius: 16px;
      padding: 12px;
      display: grid; gap: 6px;
      min-height: 86px;
    }
    .stat .lbl { color: var(--muted); font-size: 12px; font-weight: 900; letter-spacing:.2px; text-transform: uppercase; }
    .stat .val { font-size: 22px; font-weight: 900; }
    .stat .hint { font-size: 12.5px; color: var(--muted); }
    .stat.ok .val { color: var(--ok); }
    .stat.bad .val { color: var(--bad); }
    .stat.info .val { color: var(--info); }
    .stat.warn .val { color: var(--warn); }
    .section { margin-top: 14px; }
    details {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      border-radius: 18px;
      overflow: hidden;
    }
    summary {
      list-style: none;
      cursor: pointer;
      padding: 13px 16px;
      display:flex; align-items:center; justify-content:space-between; gap: 12px;
      user-select: none;
      font-weight: 860;
    }
    summary::-webkit-details-marker { display:none; }
    .badge {
      border: 1px solid var(--border);
      background: var(--chip);
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      color: var(--muted);
    }
    .badge.ok { color: var(--ok); }
    .badge.bad { color: var(--bad); }
    .badge.warn { color: var(--warn); }
    .badge.info { color: var(--info); }
    .badge.us { color: var(--us); }
    .badge.task { color: var(--task); }
    .badge.update { color: var(--update); }
    .tableWrap { padding: 10px 12px 14px; border-top: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      text-align: left; color: var(--muted); font-size: 12px;
      text-transform: uppercase; letter-spacing: .22px; font-weight: 900;
      padding: 10px 10px; border-bottom: 1px solid var(--border);
    }
    tbody td { padding: 10px 10px; border-bottom: 1px solid rgba(255,255,255,0.07); vertical-align: top; }
    tbody tr:hover td { background: rgba(255,255,255,0.03); }
    .pill {
      display:inline-flex; align-items:center; gap: 7px;
      padding: 4px 9px; border-radius: 999px; font-weight: 900; font-size: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      white-space: nowrap;
    }
    .pill.ok { color: var(--ok); }
    .pill.bad { color: var(--bad); }
    .pill.warn { color: var(--warn); }
    .pill.info { color: var(--info); }
    .pill.us { color: var(--us); }
    .pill.task { color: var(--task); }
    .pill.update { color: var(--update); }
    .filters { display:flex; gap: 10px; align-items:center; flex-wrap: wrap; margin-top: 10px; }
    .search {
      flex: 1; min-width: 220px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 10px 12px;
      color: var(--text);
      outline: none;
      font-size: 13px;
    }
    .small { font-size: 12.5px; color: var(--muted); }
    pre {
      margin: 0; padding: 12px 14px;
      background: rgba(0,0,0,0.22);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: auto;
      font-size: 12.5px;
      line-height: 1.35;
    }
    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12.5px;
      display:flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <script id="log-data" type="application/json">{{LOG_JSON}}</script>

  <div class="wrap">
    <header>
      <div class="title">
        <h1>Sync Report — Feature <span class="mono">#{{FEATURE_ID}}</span></h1>
        <p class="subtitle" id="subtitle"></p>
      </div>
      <div class="toolbar">
        <button class="btn" id="toggleTheme">Alternar tema</button>
        <button class="btn" id="copyJson">Copiar JSON</button>
        <button class="btn" id="downloadJson">Baixar JSON</button>
      </div>
    </header>

    <div class="grid">
      <section class="card" id="cardMeta">
        <div class="hd"><h2>Contexto</h2><span class="badge info" id="badgeSync"></span></div>
        <div class="bd">
          <div class="kv">
            <div class="k">Projeto</div><div class="v" id="projectName"></div>
            <div class="k">Arquivo</div><div class="v mono" id="fileName"></div>
            <div class="k">Feature ID</div><div class="v mono" id="featureId"></div>
            <div class="k">Sync ID</div><div class="v mono" id="syncId"></div>
            <div class="k">Timestamp</div><div class="v mono" id="ts"></div>
          </div>
          <div class="chips" id="chips"></div>
        </div>
      </section>

      <aside class="card" id="cardStats">
        <div class="hd"><h2>Resumo</h2><span class="badge" id="badgeHealth"></span></div>
        <div class="bd">
          <div class="stats" id="statsGrid"></div>
          <div class="filters">
            <input class="search" id="search" placeholder="Filtrar por título, tipo, ID, parent, MPP, erro..." />
            <span class="small" id="countShown"></span>
          </div>
        </div>
      </aside>
    </div>

    <div class="section" id="sections"></div>

    <div class="section">
      <details>
        <summary>JSON bruto <span class="badge">raw</span></summary>
        <div class="tableWrap">
          <pre class="mono" id="rawJson"></pre>
        </div>
      </details>
    </div>

    <div class="footer">
      <div>Gerado automaticamente • <span class="mono" id="generatedAt"></span></div>
      <div class="mono">Template: single-file HTML (CSS + JS embutidos)</div>
    </div>
  </div>

<script>
(function() {
  const data = JSON.parse(document.getElementById('log-data').textContent);
  const $ = (id) => document.getElementById(id);

  function fmtTs(ts) {
    if (!ts) return '—';
    const iso = ts.includes('T') ? ts : ts.replace(' ', 'T');
    const d = new Date(iso);
    if (isNaN(d.getTime())) return ts;
    return d.toLocaleString('pt-BR', { hour12: false });
  }

  function fmtDatePtBr(ts) {
    if (!ts) return '—';
    const iso = ts.includes('T') ? ts : ts.replace(' ', 'T');
    const d = new Date(iso);
    if (isNaN(d.getTime())) return ts;
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    const hour = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    return day + '/' + month + '/' + year + ' ' + hour + ':' + min;
  }

  function fmtHoursPtBr(hours) {
    if (hours == null || hours === undefined || hours === '') return '—';
    const h = Number(hours);
    if (isNaN(h) || h < 0) return '—';
    const fullHours = Math.floor(h);
    const minutes = Math.round((h - fullHours) * 60);
    if (minutes === 0) return fullHours + 'h';
    const minStr = String(minutes).padStart(2, '0');
    return fullHours + ':' + minStr + 'h';
  }

  function badge(text, tone) {
    const span = document.createElement('span');
    span.className = 'badge' + (tone ? ' ' + tone : '');
    span.textContent = text;
    return span;
  }

  function pill(text, tone) {
    const span = document.createElement('span');
    span.className = 'pill' + (tone ? ' ' + tone : '');
    const dot = document.createElement('span');
    dot.className = 'dot' + (tone ? ' ' + tone : '');
    span.appendChild(dot);
    span.appendChild(document.createTextNode(text));
    return span;
  }

  function normalize(str) {
    return (str ?? '').toString().toLowerCase();
  }

  function buildStat(label, value, hint, tone) {
    const div = document.createElement('div');
    div.className = 'stat' + (tone ? ' ' + tone : '');
    const l = document.createElement('div');
    l.className = 'lbl';
    l.textContent = label;
    const v = document.createElement('div');
    v.className = 'val';
    v.textContent = value;
    const h = document.createElement('div');
    h.className = 'hint';
    h.textContent = hint;
    div.append(l, v, h);
    return div;
  }

  function buildTable(items) {
    const wrap = document.createElement('div');
    wrap.className = 'tableWrap';
    const table = document.createElement('table');

    const thead = document.createElement('thead');
    const trh = document.createElement('tr');
    ['Tipo', 'Título', 'Recurso', 'Data Inicial', 'Data Final Estimada', 'Horas Original', 'WI', 'Parent', 'MPP', 'Ação', 'Erro (se houver)'].forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      trh.appendChild(th);
    });
    thead.appendChild(trh);

    const tbody = document.createElement('tbody');

    items.forEach(it => {
      const tr = document.createElement('tr');
      const isTask = (it.work_item_type || '').toLowerCase() === 'task';
      const typeTone = it.action === 'failed' ? 'bad' : (isTask ? 'task' : 'us');
      const tdType = document.createElement('td');
      tdType.appendChild(pill(it.work_item_type || '—', typeTone));

      const tdTitle = document.createElement('td');
      tdTitle.textContent = it.title || '—';

      const tdRecurso = document.createElement('td');
      tdRecurso.textContent = (it.assigned_to != null && it.assigned_to !== '') ? it.assigned_to : '—';

      const tdStart = document.createElement('td');
      tdStart.className = 'mono';
      tdStart.textContent = fmtDatePtBr(it.start_date);

      const tdTarget = document.createElement('td');
      tdTarget.className = 'mono';
      tdTarget.textContent = fmtDatePtBr(it.target_date);

      const tdHours = document.createElement('td');
      tdHours.className = 'mono';
      tdHours.textContent = fmtHoursPtBr(it.original_estimate_hours);

      const tdId = document.createElement('td');
      tdId.className = 'mono';
      tdId.textContent = it.work_item_id ?? '—';

      const tdParent = document.createElement('td');
      tdParent.className = 'mono';
      tdParent.textContent = it.parent_id ?? '—';

      const tdMpp = document.createElement('td');
      tdMpp.className = 'mono';
      tdMpp.textContent = it.mpp_task_id ?? '—';

      const tdAction = document.createElement('td');
      const actionTone = it.action === 'failed' ? 'bad' : (it.action === 'skipped' ? 'warn' : (it.action === 'created' ? 'ok' : (it.action === 'updated' ? (isTask ? 'task' : 'us') : 'info')));
      tdAction.appendChild(pill(it.action || '—', actionTone));

      const tdErr = document.createElement('td');
      tdErr.style.color = it.error ? 'var(--bad)' : 'var(--muted)';
      tdErr.textContent = it.error ? it.error : '—';

      tr.append(tdType, tdTitle, tdRecurso, tdStart, tdTarget, tdHours, tdId, tdParent, tdMpp, tdAction, tdErr);
      tbody.appendChild(tr);
    });

    table.append(thead, tbody);
    wrap.appendChild(table);
    return wrap;
  }

  // Core numbers
  const refUS = data.total_user_stories ?? data.summary?.statistics?.total_user_stories ?? 0;
  const refT  = data.total_tasks ?? data.summary?.statistics?.total_tasks ?? 0;

  const createdUS = (data.created_user_stories || []).length;
  const createdT  = (data.created_tasks || []).length;

  const updatedUS = (data.updated_user_stories || []).length;
  const updatedT  = (data.updated_tasks || []).length;

  const skippedUS = (data.skipped_user_stories || []).length;
  const skippedT  = (data.skipped_tasks || []).length;

  const failedUS  = (data.failed_user_stories || []).length;
  const allFailedT = data.failed_tasks || [];
  const isClienteRecurso = (s) => (s ?? '').toString().toLowerCase().includes('cliente');
  const tasksClienteItems = allFailedT.filter(it => isClienteRecurso(it.assigned_to));
  const failedTasksOnly = allFailedT.filter(it => !isClienteRecurso(it.assigned_to));
  const failedT = failedTasksOnly.length;
  const tasksCliente = tasksClienteItems.length;

  // Dados para exibição: "Tasks — Cliente" = falhas com recurso Cliente; "Tasks — Falhas" = demais falhas
  const displayData = Object.assign({}, data, {
    tasks_cliente: tasksClienteItems,
    failed_tasks: failedTasksOnly
  });

  // "Já existiam na Feature antes" (inferido do log)
  const existingUS = updatedUS + skippedUS + failedUS;
  const existingT  = updatedT  + skippedT  + allFailedT.length;

  // Meta
  $('projectName').textContent = data.project_name || data.summary?.project_name || '—';
  $('fileName').textContent = data.file_name || data.summary?.file_name || '—';
  $('featureId').textContent = data.feature_id ?? data.summary?.feature_id ?? '—';
  $('syncId').textContent = data.sync_id || data.summary?.sync_id || '—';
  $('ts').textContent = fmtTs(data.timestamp || data.summary?.timestamp);

  $('badgeSync').textContent = 'sync';
  $('subtitle').textContent = 'MS Project (.mpp) → Azure DevOps (Work Items) • ' + fmtTs(data.timestamp || data.summary?.timestamp);

  // Chips (headline)
  const chips = $('chips');
  const chipItems = [
    { label: 'Referência no arquivo', value: 'US ' + refUS + ' • Tasks ' + refT, tone: 'info' },
    { label: 'Já existiam na Feature', value: 'US ' + existingUS + ' • Tasks ' + existingT, tone: 'warn' },
    { label: 'Criados', value: 'US ' + createdUS + ' • Tasks ' + createdT, tone: 'ok' },
    { label: 'Atualizados', value: 'US ' + updatedUS + ' • Tasks ' + updatedT, tone: 'update' },
    { label: 'Tasks — Cliente', value: String(tasksCliente), tone: 'task' },
    { label: 'Erros', value: 'US ' + failedUS + ' • Tasks ' + failedT, tone: (failedUS + failedT) ? 'bad' : 'ok' },
  ];
  const chipItemsToShow = chipItems.filter(c => c.label !== 'Tasks — Cliente' || tasksCliente > 0);
  chipItemsToShow.forEach(c => {
    const el = document.createElement('span');
    el.className = 'chip';
    const dot = document.createElement('span');
    dot.className = 'dot ' + (c.tone || 'info');
    const txt = document.createElement('span');
    txt.textContent = c.label + ': ' + c.value;
    el.append(dot, txt);
    chips.appendChild(el);
  });

  // Summary cards (Cliente não conta como erro)
  const health = (failedUS + failedT) > 0 ? 'ATENÇÃO' : 'OK';
  $('badgeHealth').textContent = health;
  $('badgeHealth').className = 'badge ' + ((failedUS + failedT) > 0 ? 'bad' : 'ok');

  const statsGrid = $('statsGrid');
  statsGrid.appendChild(buildStat('No arquivo (ref.)', refUS + refT, 'User Stories: ' + refUS + ' • Tasks: ' + refT, 'info'));
  statsGrid.appendChild(buildStat('Na Feature (antes)', existingUS + existingT, 'User Stories: ' + existingUS + ' • Tasks: ' + existingT, 'warn'));
  statsGrid.appendChild(buildStat('Criados', createdUS + createdT, 'User Stories: ' + createdUS + ' • Tasks: ' + createdT, 'ok'));
  statsGrid.appendChild(buildStat('Atualizados', updatedUS + updatedT, 'User Stories: ' + updatedUS + ' • Tasks: ' + updatedT, 'ok'));
  if (tasksCliente > 0) statsGrid.appendChild(buildStat('Tasks — Cliente', tasksCliente, 'Tasks com recurso Cliente (não contam como erro)', 'task'));
  statsGrid.appendChild(buildStat('Ignorados', skippedUS + skippedT, 'User Stories: ' + skippedUS + ' • Tasks: ' + skippedT, 'warn'));
  statsGrid.appendChild(buildStat('Erros', failedUS + failedT, 'User Stories: ' + failedUS + ' • Tasks: ' + failedT, (failedUS + failedT) ? 'bad' : 'ok'));

  // Sections: User Story = azul claro (us), Task = amarelo (task), Falhas = bad
  const sections = [
    { key: 'created_user_stories', label: 'User Stories — Criadas', tone: 'us' },
    { key: 'updated_user_stories', label: 'User Stories — Atualizadas', tone: 'us' },
    { key: 'skipped_user_stories', label: 'User Stories — Ignoradas', tone: 'us' },
    { key: 'failed_user_stories', label: 'User Stories — Falhas', tone: 'bad' },
    { key: 'created_tasks', label: 'Tasks — Criadas', tone: 'task' },
    { key: 'updated_tasks', label: 'Tasks — Atualizadas', tone: 'task' },
    { key: 'skipped_tasks', label: 'Tasks — Ignoradas', tone: 'task' },
    { key: 'tasks_cliente', label: 'Tasks — Cliente', tone: 'task' },
    { key: 'failed_tasks', label: 'Tasks — Falhas', tone: 'bad' },
  ];

  function allItems() {
    const items = [];
    sections.forEach(s => {
      const arr = displayData[s.key] || [];
      arr.forEach(it => items.push(Object.assign({}, it, {__section: s.key})));
    });
    return items;
  }

  const index = allItems();
  const sectionsEl = $('sections');

  function render(filterText) {
    sectionsEl.innerHTML = '';
    const q = normalize(filterText);
    let shownTotal = 0;

    sections.forEach(s => {
      const arr = (displayData[s.key] || []);
      const filtered = q
        ? arr.filter(it => {
            const hay = [
              it.title, it.work_item_type, it.work_item_id, it.parent_id,
              it.action, it.mpp_task_id, it.error, it.assigned_to
            ].map(x => (x ?? '').toString()).join(' • ').toLowerCase();
            return hay.includes(q);
          })
        : arr;

      if (filtered.length === 0 && !q) return;
      shownTotal += filtered.length;

      const d = document.createElement('details');
      d.open = (s.key.includes('failed') && filtered.length) || (q && filtered.length);

      const sum = document.createElement('summary');
      sum.appendChild(document.createTextNode(s.label));

      const right = document.createElement('div');
      right.style.display = 'flex';
      right.style.gap = '10px';
      right.style.alignItems = 'center';
      right.appendChild(badge(filtered.length + ' item(s)', s.tone));
      if ((s.key === 'failed_user_stories' || s.key === 'failed_tasks') && filtered.length) right.appendChild(badge('verificar', 'bad'));
      sum.appendChild(right);

      d.appendChild(sum);

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'tableWrap';
        const p = document.createElement('div');
        p.className = 'small';
        p.textContent = 'Sem itens nesta categoria.';
        empty.appendChild(p);
        d.appendChild(empty);
      } else {
        d.appendChild(buildTable(filtered));
      }

      sectionsEl.appendChild(d);
      const spacer = document.createElement('div');
      spacer.style.height = '10px';
      sectionsEl.appendChild(spacer);
    });

    $('countShown').textContent = q ? (shownTotal + ' item(s) visíveis') : (index.length + ' item(s) no total');
  }

  render('');
  $('search').addEventListener('input', (e) => render(e.target.value));

  // Raw JSON
  $('rawJson').textContent = JSON.stringify(data, null, 2);

  // Theme toggle
  $('toggleTheme').addEventListener('click', () => {
    const root = document.documentElement;
    const cur = root.getAttribute('data-theme') || 'dark';
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });

  // Copy / Download
  $('copyJson').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(JSON.stringify(data, null, 2));
      $('copyJson').textContent = 'Copiado ✓';
      setTimeout(() => $('copyJson').textContent = 'Copiar JSON', 1200);
    } catch (e) {
      alert('Não foi possível copiar automaticamente. Abra a seção "JSON bruto" e copie manualmente.');
    }
  });

  $('downloadJson').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const safe = (data.feature_id ?? 'log').toString().replace(/[^a-z0-9_-]/gi,'_');
    a.download = 'sync_log_' + safe + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // Footer
  $('generatedAt').textContent = new Date().toLocaleString('pt-BR', { hour12: false });
})();
</script>
</body>
</html>
